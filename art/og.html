<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400&family=Syne:wght@800&display=swap" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0a0a0f; color: #eeeef2; }
  .bg { position: absolute; inset: 0; background: url(../public/art/era-2017-node.webp) center/cover; opacity: .35;
        mask-image: radial-gradient(80% 90% at 85% 50%, #000, transparent); }
  .glow { position: absolute; inset: 0; background: radial-gradient(600px 400px at 20% 30%, rgba(200,240,96,.12), transparent 70%); }
  main { position: absolute; inset: 0; padding: 72px 80px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font: 400 20px "DM Mono"; letter-spacing: .3em; text-transform: uppercase; color: #c8f060; display: flex; align-items: center; gap: 16px; }
  .eyebrow i { width: 12px; height: 12px; border-radius: 50%; background: #c8f060; box-shadow: 0 0 16px #c8f060; }
  h1 { font: 800 112px/0.92 "Syne"; letter-spacing: -.04em; margin: 28px 0 28px; }
  h1 span { color: #c8f060; display: block; }
  p { font: 400 26px "DM Mono"; color: rgba(238,238,242,.7); margin: 0; }
  .url { position: absolute; right: 80px; bottom: 56px; font: 400 20px "DM Mono"; color: rgba(238,238,242,.5); }
</style>
</head>
<body>
  <div class="bg"></div><div class="glow"></div>
  <main>
    <div class="eyebrow"><i></i>Senior Software Engineer · 13+ years</div>
    <h1>Balaji<span>Premkumar</span></h1>
    <p>.NET · React · Cloud — enterprise systems, end to end.</p>
  </main>
  <div class="url">balaji-premkumar.github.io</div>
</body>
</html>
